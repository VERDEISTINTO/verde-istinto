<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verde Istinto | Allevamento Pulcini</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7f5;
scroll-behavior:smooth;
color:#222;
}

/* HEADER */
header{
background:linear-gradient(90deg,#145a14,#2e7d32);
color:white;
text-align:center;
padding:25px;
position:relative;
}

header h1{
margin:0;
font-size:38px;
}

/* SEARCH */
.search-wrapper{
position:fixed;
top:15px;
right:15px;
z-index:9999;
}

.search-btn{
background:white;
border:none;
border-radius:50%;
width:45px;
height:45px;
cursor:pointer;
font-size:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.search-box{
display:none;
position:absolute;
right:0;
top:55px;
width:260px;
background:white;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.2);
overflow:hidden;
}

.search-box input{
width:100%;
padding:10px;
border:none;
outline:none;
border-bottom:1px solid #eee;
}

.result{
display:flex;
align-items:center;
gap:10px;
padding:8px;
cursor:pointer;
}

.result:hover{background:#f0f0f0;}

.result img{
width:40px;
height:40px;
object-fit:cover;
border-radius:6px;
}

/* NAV */
nav{
background:#0f3d0f;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:10px;
position:sticky;
top:0;
z-index:1000;
}

nav a{
color:white;
padding:12px 18px;
text-decoration:none;
font-weight:bold;
background:rgba(255,255,255,0.08);
border-radius:30px;
}

/* HERO */
.hero{
background:url('https://images.unsplash.com/photo-1548550023-2bdb3c5beed7') center/cover;
height:320px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:28px;
text-shadow:2px 2px 8px black;
}

/* SEZIONI */
section{
padding:50px 20px;
text-align:center;
}

/* SLIDER */
.slider{
max-width:800px;
margin:20px auto;
overflow:hidden;
border-radius:14px;
}

.slide{
width:100%;
height:400px;
object-fit:cover;
display:none;
}

.slide.active{display:block;}

/* CATEGORIE (COME PRIMA, SEMPLICI) */
.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:white;
width:260px;
padding:25px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

.card button{
background:#145a14;
color:white;
border:none;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
}

/* CONTATTI */
#contatti{
background:#fff;
}

/* SOCIAL */
.social a{
display:inline-block;
margin:6px;
padding:10px 18px;
border-radius:25px;
color:white;
text-decoration:none;
}

.ig{background:#E1306C;}
.yt{background:#FF0000;}

footer{
background:#0f3d0f;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
<h1>🌿 Verde Istinto</h1>
</header>

<!-- SEARCH -->
<div class="search-wrapper">

<button class="search-btn" onclick="toggleSearch()">🔍</button>

<div class="search-box" id="searchBox">
<input id="searchInput" oninput="searchBreed()" placeholder="Cerca razza...">
<div id="results"></div>
</div>

</div>

<!-- NAV -->
<nav>
<a href="#chi">Chi Siamo</a>
<a href="#slider">Razze</a>
<a href="#categorie">Categorie</a>
<a href="#contatti">Contatti</a>
</nav>

<div class="hero">
Qualità, selezione e crescita naturale
</div>

<!-- CHI SIAMO -->
<section id="chi">
<h2>Chi Siamo</h2>
<p>Allevamento professionale in Puglia.</p>
</section>

<!-- SLIDER -->
<section id="slider">

<h2>🐓 Razze</h2>

<div class="slider">

<img class="slide active" src="foto/ancona.jpg" id="Ancona">
<img class="slide" src="foto/brahma.jpg" id="Brahma">
<img class="slide" src="foto/isa-brown.jpg" id="Isa Brown">
<img class="slide" src="foto/lakenvelder.jpg" id="Lakenvelder">
<img class="slide" src="foto/livorno.jpg" id="Livorno">
<img class="slide" src="foto/marans.jpg" id="Marans">
<img class="slide" src="foto/moroseta.jpg" id="Moroseta">
<img class="slide" src="foto/padovana.jpg" id="Padovana">
<img class="slide" src="foto/sebright.jpg" id="Sebright">
<img class="slide" src="foto/sussex.jpg" id="Sussex">

</div>

</section>

<!-- CATEGORIE (RESTANO UGUALI) -->
<section id="categorie">

<h2>Categorie</h2>

<div class="cards">

<div class="card">
<h3>Ovaiole</h3>
<a href="ovaiole.html"><button>Visualizza Razze</button></a>
</div>

<div class="card">
<h3>Ornamentali</h3>
<a href="ornamentali.html"><button>Visualizza Razze</button></a>
</div>

<div class="card">
<h3>Rustici</h3>
<a href="rustici.html"><button>Visualizza Razze</button></a>
</div>

</div>

</section>

<!-- CONTATTI -->
<section id="contatti">

<h2>Contatti</h2>

<p>📱 327 813 1071</p>
<p>✉️ info@verdeistinto.it</p>

<div class="social">
<a class="ig" href="#">Instagram</a>
<a class="yt" href="#">YouTube</a>
</div>

</section>

<footer>
© 2026 Verde Istinto
</footer>

<script>

/* SEARCH */
const breeds = [
{name:"Ancona",img:"foto/ancona.jpg"},
{name:"Brahma",img:"foto/brahma.jpg"},
{name:"Isa Brown",img:"foto/isa-brown.jpg"},
{name:"Lakenvelder",img:"foto/lakenvelder.jpg"},
{name:"Livorno",img:"foto/livorno.jpg"},
{name:"Marans",img:"foto/marans.jpg"},
{name:"Moroseta",img:"foto/moroseta.jpg"},
{name:"Padovana",img:"foto/padovana.jpg"},
{name:"Sebright",img:"foto/sebright.jpg"},
{name:"Sussex",img:"foto/sussex.jpg"}
];

function toggleSearch(){
let box=document.getElementById("searchBox");
box.style.display=box.style.display==="block"?"none":"block";
}

function searchBreed(){
let val=document.getElementById("searchInput").value.toLowerCase();
let res=document.getElementById("results");
res.innerHTML="";

breeds.filter(b=>b.name.toLowerCase().includes(val))
.forEach(b=>{
let div=document.createElement("div");
div.className="result";
div.innerHTML=`<img src="${b.img}"><span>${b.name}</span>`;
div.onclick=()=>goToBreed(b.name);
res.appendChild(div);
});
}

/* 🔥 ORA VA A CATEGORIE */
function goToBreed(name){

document.getElementById("categorie").scrollIntoView({behavior:"smooth"});

let all=document.getElementsByClassName("slide");

for(let i=0;i<all.length;i++){
if(all[i].id.toLowerCase()===name.toLowerCase()){
for(let s of all)s.classList.remove("active");
all[i].classList.add("active");
break;
}
}

document.getElementById("searchBox").style.display="none";
document.getElementById("searchInput").value="";
}

</script>

</body>
</html>
