<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verde Istinto | Allevamento Pulcini</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7f5;
scroll-behavior:smooth;
color:#222;
}

/* HEADER */
header{
background:linear-gradient(90deg,#145a14,#2e7d32);
color:white;
text-align:center;
padding:25px;
position:relative;
}

header h1{
margin:0;
font-size:38px;
}

/* 🔍 SEARCH */
.search-box{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
}

.search-icon{
font-size:22px;
cursor:pointer;
}

#searchInput{
display:none;
padding:6px 10px;
border-radius:20px;
border:none;
outline:none;
margin-top:5px;
width:180px;
}

.suggestions{
position:absolute;
right:0;
top:45px;
background:white;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
width:220px;
display:none;
z-index:9999;
}

.suggestion-item{
display:flex;
align-items:center;
gap:10px;
padding:8px;
cursor:pointer;
}

.suggestion-item:hover{
background:#f0f0f0;
}

.suggestion-item img{
width:40px;
height:40px;
object-fit:cover;
border-radius:6px;
}

/* NAV MIGLIORATO */
nav{
background:#0f3d0f;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:10px;
position:sticky;
top:0;
z-index:1000;
}

nav a{
color:white;
padding:12px 18px;
text-decoration:none;
font-weight:bold;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
border-radius:30px;
transition:0.25s;
}

nav a:hover{
background:#25d366;
transform:scale(1.05);
}

/* HERO */
.hero{
background:url('https://images.unsplash.com/photo-1548550023-2bdb3c5beed7') center/cover;
height:320px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:28px;
text-shadow:2px 2px 8px black;
}

/* SEZIONI */
section{
padding:50px 20px;
text-align:center;
}

/* SLIDER */
.slider{
max-width:800px;
margin:20px auto;
overflow:hidden;
border-radius:14px;
position:relative;
}

.slide{
width:100%;
height:400px;
object-fit:cover;
display:none;
border-radius:14px;
}

.slide.active{display:block;}

/* CATEGORIE */
.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:white;
width:260px;
padding:20px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

button{
background:#145a14;
color:white;
border:none;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
}

/* CONTATTI */
#contatti{
background:#fff;
padding:50px 20px;
}

/* FOOTER */
footer{
background:#0f3d0f;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
<h1>🌿 Verde Istinto</h1>

<div class="search-box">
<span class="search-icon" onclick="toggleSearch()">🔍</span>
<input id="searchInput" oninput="searchBreed()" placeholder="Cerca razza...">
<div id="suggestions" class="suggestions"></div>
</div>

</header>

<nav>
<a href="#chi">Chi Siamo</a>
<a href="#slider">Razze</a>
<a href="#categorie">Categorie</a>
<a href="#contatti">Contatti</a>
</nav>

<div class="hero">
Qualità, selezione e crescita naturale
</div>

<!-- SLIDER -->
<section id="slider">

<h2>🐓 Razze</h2>

<div class="slider">

<img class="slide active" id="ancona" src="foto/ancona.jpg">
<img class="slide" id="brahma" src="foto/brahma.jpg">
<img class="slide" id="isa brown" src="foto/isa-brown.jpg">
<img class="slide" id="lakenvelder" src="foto/lakenvelder.jpg">
<img class="slide" id="livorno" src="foto/livorno.jpg">
<img class="slide" id="livorno collo oro" src="foto/livornocollooro.jpg">
<img class="slide" id="marans" src="foto/marans.jpg">
<img class="slide" id="moroseta" src="foto/moroseta.jpg">
<img class="slide" id="padovana" src="foto/padovana.jpg">
<img class="slide" id="sebright" src="foto/sebright.jpg">
<img class="slide" id="sussex" src="foto/sussex.jpg">

</div>
</section>

<!-- SCRIPT -->
<script>

let slides = document.getElementsByClassName("slide");
let current = 0;

/* SLIDER AUTO */
setInterval(()=>{
for(let s of slides) s.classList.remove("active");
current++;
if(current >= slides.length) current = 0;
slides[current].classList.add("active");
},3000);

/* DATA RAZZE */
const breeds = [
{ name:"Ancona", img:"foto/ancona.jpg" },
{ name:"Brahma", img:"foto/brahma.jpg" },
{ name:"Isa Brown", img:"foto/isa-brown.jpg" },
{ name:"Lakenvelder", img:"foto/lakenvelder.jpg" },
{ name:"Livorno", img:"foto/livorno.jpg" },
{ name:"Livorno collo oro", img:"foto/livornocollooro.jpg" },
{ name:"Marans", img:"foto/marans.jpg" },
{ name:"Moroseta", img:"foto/moroseta.jpg" },
{ name:"Padovana", img:"foto/padovana.jpg" },
{ name:"Sebright", img:"foto/sebright.jpg" },
{ name:"Sussex", img:"foto/sussex.jpg" }
];

function toggleSearch(){
let input = document.getElementById("searchInput");
input.style.display = input.style.display === "block" ? "none" : "block";
input.focus();
}

function searchBreed(){
let val = document.getElementById("searchInput").value.toLowerCase();
let box = document.getElementById("suggestions");

box.innerHTML = "";
if(val === ""){
box.style.display = "none";
return;
}

let filtered = breeds.filter(b => b.name.toLowerCase().includes(val));

filtered.forEach(b=>{
let div = document.createElement("div");
div.className = "suggestion-item";
div.innerHTML = `<img src="${b.img}"><span>${b.name}</span>`;
div.onclick = () => goToBreed(b.name);
box.appendChild(div);
});

box.style.display = "block";
}

function goToBreed(name){
let all = document.getElementsByClassName("slide");

for(let i=0;i<all.length;i++){
all[i].classList.remove("active");

if(all[i].id.toLowerCase() === name.toLowerCase()){
all[i].classList.add("active");
current = i;
}
}

document.getElementById("suggestions").style.display = "none";
document.getElementById("searchInput").value = "";
}

</script>

</body>
</html>
