backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pulcini"
    label: "Pulcini"
    folder: "content/pulcini"
    create: true
    fields:
      - { name: "titolo", label: "Titolo" }
      - { name: "descrizione", label: "Descrizione" }
      - { name: "prezzo", label: "Prezzo" }
