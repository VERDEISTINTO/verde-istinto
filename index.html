<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verde Istinto | Allevamento Pulcini</title>

<style>
/* === IL TUO CSS INVARIATO === */
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7f5;
scroll-behavior:smooth;
color:#222;
}

header{
background:linear-gradient(90deg,#145a14,#2e7d32);
color:white;
text-align:center;
padding:25px;
position:relative;
}

.logo{
width:110px;
height:110px;
margin:0 auto 10px;
display:block;
}

header h1{margin:0;font-size:38px;}
header p{margin:5px 0 0;font-size:14px;opacity:0.9;letter-spacing:1px;}

.search-wrapper{position:fixed;top:15px;right:15px;z-index:9999;}

.search-btn{
background:white;border:none;border-radius:50%;
width:45px;height:45px;cursor:pointer;
font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.search-box{
display:none;
position:absolute;
right:0;
top:55px;
width:260px;
background:white;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.2);
overflow:hidden;
}

.search-box input{
width:100%;
padding:10px;
border:none;
outline:none;
border-bottom:1px solid #eee;
}

.result{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer;}
.result:hover{background:#f0f0f0;}
.result img{width:40px;height:40px;object-fit:cover;border-radius:6px;}

nav{
background:#0f3d0f;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:10px;
position:sticky;
top:0;
z-index:1000;
}

nav a{
color:white;
padding:12px 18px;
text-decoration:none;
font-weight:bold;
background:rgba(255,255,255,0.08);
border-radius:30px;
}

.hero{
background:url('https://images.unsplash.com/photo-1548550023-2bdb3c5beed7') center/cover;
height:320px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:28px;
text-shadow:2px 2px 8px black;
}

section{padding:50px 20px;text-align:center;}

.slider{
max-width:800px;
margin:20px auto;
position:relative;
height:400px;
overflow:hidden;
border-radius:14px;
}

.slide{
position:absolute;
top:0;left:0;
width:100%;height:400px;
object-fit:cover;
opacity:0;
transition:opacity 1.2s ease-in-out;
border-radius:14px;
}

.slide.active{opacity:1;}
</style>
</head>

<body>

<header>
<svg class="logo" viewBox="0 0 200 200">
<path d="M100 20 C60 40, 40 90, 70 130 C90 160, 120 160, 140 130 C170 90, 140 40, 100 20 Z"/>
</svg>

<h1>🌿 Verde Istinto</h1>
<p>Allevamento pulcini selezionati</p>
</header>

<div class="search-wrapper">
<button class="search-btn" onclick="toggleSearch()">🔍</button>
<div class="search-box" id="searchBox">
<input id="searchInput" oninput="searchBreed()" placeholder="Cerca razza...">
<div id="results"></div>
</div>
</div>

<div class="hero">Qualità, selezione e crescita naturale</div>

<section id="slider">
<div class="slider">
<img class="slide active" src="foto/ancona.jpg">
<img class="slide" src="foto/brahma.jpg">
<img class="slide" src="foto/isa-brown.jpg">
<img class="slide" src="foto/sussex.jpg">
</div>
</section>

<script>

/* SEARCH BOX */
function toggleSearch(){
const box = document.getElementById("searchBox");
box.style.display = (box.style.display === "block") ? "none" : "block";
}

/* DATABASE RAZZE */
const breeds = [
{ name:"ancona", img:"foto/ancona.jpg" },
{ name:"isa brown", img:"foto/isa-brown.jpg" },
{ name:"sussex", img:"foto/sussex.jpg" },
{ name:"livorno", img:"foto/livorno.jpg" },
{ name:"moroseta", img:"foto/moroseta.jpg" },
{ name:"padovana", img:"foto/padovana.jpg" },
{ name:"sebright", img:"foto/sebright.jpg" },
{ name:"lakenvelder", img:"foto/lakenvelder.jpg" },
{ name:"marans", img:"foto/marans.jpg" },
{ name:"brahma", img:"foto/brahma.jpg" }
];

/* RICERCA */
function searchBreed(){
const input = document.getElementById("searchInput").value.toLowerCase().trim();
const results = document.getElementById("results");

results.innerHTML = "";
if(input.length < 1) return;

breeds
.filter(b => b.name.includes(input))
.forEach(b => {
results.innerHTML += `
<div class="result">
<img src="${b.img}">
<span>${b.name}</span>
</div>`;
});
}

/* SLIDER */
let slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
slides.forEach(s => s.classList.remove("active"));
index = (index + 1) % slides.length;
slides[index].classList.add("active");
}, 4000);

</script>

</body>
</html>
